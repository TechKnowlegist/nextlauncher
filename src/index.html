<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nextlauncher Preview</title>
<style>
/* ===== Nextlayer tokens (from Nextlayer.css) ===== */
:root{
  --bg:#0a120d; --panel:#0e1913; --panel2:#132219; --panel3:#18291f;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --text:#e8f2ec; --muted:#a3b8ac;
  --a1:#22c55e; --a2:#38bdf8; --h1:#3b82f6; --h2:#a855f7;
  --ink:#05130c; --danger:#ef4444; --warn:#eab308;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,'Segoe UI',Roboto,sans-serif;display:grid;grid-template-rows:60px 1fr 48px;overflow:hidden}
::selection{background:rgba(45,193,171,.5);color:#fff}
h1::selection,h2::selection{background:rgba(113,107,246,.5)}
h1,h2,h3{line-height:1.2}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--a2);outline-offset:3px}
.skip{position:absolute;left:12px;top:-80px;z-index:200;padding:10px 16px;border-radius:10px;background:var(--a1);color:var(--ink);font-weight:800;text-decoration:none}
.skip:focus{top:12px}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* Gradient text: blue/purple for headings, green/turquoise for text */
.grad-h{background:linear-gradient(90deg,var(--h1),var(--h2),var(--h1));background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shimmer 6s ease-in-out infinite}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.grad-t{background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}

/* ===== Buttons: bounce + Nextlayer diagonal white wipe ===== */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:999px;border:1px solid transparent;font:inherit;font-weight:700;cursor:pointer;color:var(--text);background:transparent;text-decoration:none;white-space:nowrap;
  transition:transform .45s var(--spring),box-shadow .3s ease,background-color .2s ease,background-size .45s var(--ease),color .3s ease,border-color .2s ease,opacity .2s}
.btn svg{width:18px;height:18px;flex:none}
.btn::before{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);transition:left .6s ease;pointer-events:none}
.btn:hover:not(:disabled)::before,.btn:focus-visible::before{left:130%}
.btn:hover:not(:disabled){transform:scale(1.06)}
.btn:active:not(:disabled){transform:scale(.93);transition-duration:.12s}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:linear-gradient(90deg,var(--a1),var(--a2));color:var(--ink)}
.btn-primary:hover:not(:disabled){box-shadow:0 8px 28px -6px var(--a1),0 4px 18px -4px var(--a2)}
.btn-secondary{border-color:var(--h1)}
.btn-secondary:hover:not(:disabled){background:rgba(59,130,246,.15);border-color:var(--a2);box-shadow:0 6px 20px -6px var(--a2)}
.btn-ghost{border-color:var(--line2)}
.btn-ghost:hover:not(:disabled){background:rgba(255,255,255,.06)}
.btn-danger{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.65);color:#fecaca}
.btn-danger:hover:not(:disabled){background:rgba(239,68,68,.25);box-shadow:0 6px 20px -8px var(--danger)}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-lg{padding:14px 34px;font-size:1.1rem}
.link-btn{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.link-btn:hover{text-decoration:underline;text-decoration-color:var(--a2)}

/* ===== Top bar ===== */
.topbar{display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem}
.logo svg{width:34px;height:34px;transition:transform .6s var(--spring)}
.logo:hover svg{transform:rotate(-12deg) scale(1.12)}
.logo-text{background:linear-gradient(90deg,var(--a1),var(--a2),var(--h2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.preview-tag{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.acct{margin-left:auto;display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font:inherit;font-weight:700;cursor:pointer;transition:transform .45s var(--spring),border-color .2s}
.acct:hover{transform:scale(1.05);border-color:var(--a2)}
.avatar{width:30px;height:30px;border-radius:8px;overflow:hidden;display:block}
.avatar svg{width:100%;height:100%;display:block}

/* ===== Shell ===== */
.shell{display:grid;grid-template-columns:84px 1fr 92px;min-height:0}
.instbar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#instList{list-style:none;margin:0;padding:14px 0;flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;gap:10px;scrollbar-width:none}
#instList::-webkit-scrollbar{display:none}
.inst-item{position:relative;width:100%;display:flex;justify-content:center;flex:none}
.inst-divider{width:32px;height:2px;border-radius:2px;background:var(--line2);flex:none;margin:2px 0}
.inst-pill{position:absolute;left:0;top:50%;width:4px;height:40px;border-radius:0 4px 4px 0;background:linear-gradient(var(--a1),var(--a2));transform:translateY(-50%) scaleY(0);transition:transform .35s var(--spring)}
.inst-item:hover .inst-pill,.inst-item:focus-within .inst-pill{transform:translateY(-50%) scaleY(.45)}
.inst-item.is-selected .inst-pill{transform:translateY(-50%) scaleY(1)}
.inst-btn{position:relative;width:52px;height:52px;padding:0;border:0;border-radius:50%;background:var(--panel3);color:var(--a1);display:grid;place-items:center;overflow:hidden;cursor:pointer;transition:border-radius .3s var(--ease),background .25s,transform .45s var(--spring),box-shadow .25s}
.inst-btn:hover,.inst-btn:focus-visible,.inst-item.is-selected .inst-btn{border-radius:16px;background:linear-gradient(145deg,rgba(34,197,94,.32),rgba(56,189,248,.24))}
.inst-item.is-selected .inst-btn{box-shadow:0 0 0 2px rgba(34,197,94,.55)}
.inst-btn:active{transform:scale(.9)}
.inst-btn svg{width:34px;height:34px;display:block;transition:transform .45s var(--spring)}
.inst-btn:hover svg{transform:scale(1.12) rotate(-6deg)}
.inst-btn img{width:100%;height:100%;object-fit:cover;display:block}
.inst-add{background:transparent;border:2px dashed var(--line2)}
.inst-add svg{width:24px;height:24px}
.inst-add:hover,.inst-add:focus-visible{border-style:solid;border-color:transparent;background:linear-gradient(145deg,var(--a1),var(--a2));color:var(--ink)}
.inst-add:hover svg{transform:rotate(90deg)}

#content{overflow:auto;padding:28px 34px 40px;position:relative;scroll-behavior:smooth}
#content:focus{outline:none}

.rightnav{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px}
.rn-btn{display:flex;flex-direction:column;align-items:center;gap:4px;width:74px;padding:10px 4px;border-radius:14px;border:0;background:none;color:var(--muted);font:inherit;font-size:.75rem;font-weight:700;cursor:pointer;transition:transform .45s var(--spring),background .2s,color .2s}
.rn-btn svg{width:24px;height:24px}
.rn-btn:hover{transform:scale(1.08);color:var(--text);background:var(--panel2)}
.rn-btn[aria-current="page"]{color:var(--ink);background:linear-gradient(160deg,var(--a1),var(--a2))}

.bottombar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;background:var(--panel);border-top:1px solid var(--line);font-size:.76rem;color:var(--muted)}

/* ===== Page animations ===== */
.page-in{animation:pageIn .5s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
.panel-in{animation:panelIn .35s var(--ease)}
@keyframes panelIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* ===== Empty states ===== */
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:60px 20px}
.empty-state h1{font-size:2rem;margin:10px 0 0}
.empty-state h2{font-size:1.35rem;margin:8px 0 0}
.empty-state p{margin:0;font-size:1.05rem;font-weight:600}
.empty-state.small{padding:34px 20px}
.empty-art{width:min(300px,80%);height:auto}
.empty-state.small .empty-art{width:170px}
.arrow-nudge{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(-10px)}}
.dash-march{animation:march 2s linear infinite}
@keyframes march{to{stroke-dashoffset:-26}}
.lid-wiggle{transform-origin:50% 100%;animation:lid 3s ease-in-out infinite}
@keyframes lid{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-4deg)}94%{transform:rotate(2deg)}}

/* ===== Instance page ===== */
.inst-hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:22px;padding:26px;border-radius:20px;background:#050a07;border:1px solid var(--line)}
.inst-hero::before{content:'';position:absolute;inset:-40%;background:
  linear-gradient(115deg,transparent 46%,rgba(59,130,246,.25) 48%,transparent 50%),
  linear-gradient(65deg,transparent 30%,rgba(34,197,94,.22) 32%,transparent 34%),
  linear-gradient(100deg,transparent 70%,rgba(168,85,247,.22) 72%,transparent 74%);
  filter:blur(6px);animation:beams 12s ease-in-out infinite;pointer-events:none}
@keyframes beams{0%,100%{transform:translateX(0)}50%{transform:translateX(30px)}}
.inst-hero>*{position:relative}
.hero-icon{width:72px;height:72px;flex:none;animation:floaty 4s ease-in-out infinite}
.hero-icon svg,.hero-icon img{width:100%;height:100%;display:block}
.hero-text{flex:1;min-width:0}
.hero-text h1{margin:0 0 6px;font-size:2rem}
.hero-meta{margin:0;color:var(--muted);font-weight:600}
.tabs{position:relative;display:flex;flex-wrap:wrap;gap:6px;margin:22px 0 18px;padding:4px;background:var(--panel2);border-radius:12px;width:fit-content}
.tabs::before{content:'';position:absolute;left:var(--px,4px);top:var(--py,4px);width:var(--pw,0);height:var(--ph,0);border-radius:9px;background:linear-gradient(90deg,var(--a1),var(--a2));box-shadow:0 6px 18px -8px var(--a2);transition:left .35s var(--ease),top .35s var(--ease),width .35s var(--ease),height .35s var(--ease)}
.tabs.no-anim::before{transition:none}
.tab{position:relative;z-index:1;overflow:hidden;padding:9px 18px;border-radius:9px;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;cursor:pointer;transition:color .25s,filter .2s}
.tab:hover{color:var(--text);filter:drop-shadow(0 0 6px var(--a2))}
.tab[aria-selected="true"],.tab[aria-selected="true"]:hover{color:var(--ink);filter:none}
.tab-panel:focus-visible{outline-offset:6px;border-radius:12px}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:20px}
.card-wide{grid-column:1/-1}
.card h2{font-size:1.1rem;margin:0 0 12px}
.qp-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.qp-list li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border-radius:12px;background:var(--panel3)}
.qp-list .qp-name{flex:1;min-width:110px}
.qp-kind{font-size:.7rem;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(56,189,248,.15);color:#7dd3fc}
.qp-name{font-weight:700}
.qp-when{font-size:.8rem;color:var(--muted)}
.title-preview{margin:0;padding:0;list-style:none;display:grid;gap:6px;counter-reset:t}
.title-preview li{padding:8px 12px;border-radius:8px;background:#26302a;border:1px solid #3a4a40;font-weight:700;text-align:center;font-family:ui-monospace,Consolas,monospace;font-size:.85rem}
.title-preview li:first-child{border-color:var(--a1);box-shadow:0 0 14px -4px var(--a1)}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line);margin:0}
.opt-row:first-of-type{border-top:0}
fieldset.opt-row{border-left:0;border-right:0;border-bottom:0;min-inline-size:0}
.opt-row>label,.opt-row legend,.opt-label{font-weight:700;float:left}
.opt-ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{margin:6px 0 0;width:100%;font-size:.85rem;color:#fde68a}

/* ===== Form fields ===== */
select,textarea,input[type=text],input[type=search]{background-color:rgba(255,255,255,.05);background-image:linear-gradient(90deg,rgba(34,197,94,.2),rgba(56,189,248,.2));background-repeat:no-repeat;background-position:right center;background-size:0% 100%;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;color:var(--text);font:inherit;caret-color:#38bdf8;transition:background-size .4s var(--ease),border-color .3s,box-shadow .35s}
select:hover,select:focus,textarea:hover,textarea:focus,input[type=text]:hover,input[type=text]:focus,input[type=search]:hover,input[type=search]:focus{background-size:100% 100%;border-color:rgba(56,189,248,.5);box-shadow:0 0 16px rgba(56,189,248,.22)}
select option{background:#0e1913}
.field{display:flex;flex-direction:column;gap:6px;border:0;padding:0;margin:0;min-inline-size:0}
.field>label,.field>legend{font-weight:700;font-size:.85rem;padding:0}
.field.grow{flex:1;min-width:200px}
.err{margin:0;color:#fca5a5;font-weight:600;font-size:.88rem}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.choice-list{display:grid;gap:8px}
.choice-list.two{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.choice{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border:1px solid var(--line2);border-radius:12px;cursor:pointer;transition:border-color .2s,background .2s,transform .4s var(--spring)}
.choice:hover{transform:scale(1.02)}
.choice input{accent-color:var(--a1);margin-top:4px;width:17px;height:17px;flex:none}
.choice:has(input:checked){border-color:var(--a1);background:rgba(34,197,94,.09)}
.choice:has(input:disabled){opacity:.45;cursor:not-allowed;transform:none}
.choice-title{font-weight:700;display:block}
.choice-desc{font-size:.84rem;color:var(--muted);display:block}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.icon-tile{position:relative;display:grid;place-items:center;padding:10px;border:2px solid var(--line);border-radius:12px;cursor:pointer;transition:transform .4s var(--spring),border-color .2s,background .2s}
.icon-tile svg,.icon-tile img{width:40px;height:40px;display:block}
.icon-tile img{border-radius:6px;object-fit:cover}
.icon-tile input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.icon-tile:hover{transform:scale(1.07)}
.icon-tile:has(input:checked){border-color:var(--a1);background:rgba(34,197,94,.1);transform:scale(1.07)}
.icon-tile:has(input:focus-visible){outline:2px solid var(--a2);outline-offset:2px}
.file-label{margin-top:10px;cursor:pointer;width:fit-content}
.file-label:focus-within{outline:2px solid var(--a2);outline-offset:3px}
.step-count{margin:0 0 4px;font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wiz-body{display:grid;gap:18px;margin-top:16px}

/* ===== Content tab ===== */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .spacer{flex:1}
.inline-label{font-weight:700}
.item-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item-row{display:flex;align-items:center;gap:14px;padding:10px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;transition:border-color .2s}
.item-row:hover,.item-row:focus-within{border-color:rgba(56,189,248,.4)}
.item-icon{width:36px;height:36px;flex:none}
.item-icon svg{width:100%;height:100%;display:block}
.item-text{flex:1;display:flex;flex-direction:column;min-width:0}
.item-name{font-weight:700}
.item-meta{font-size:.8rem;color:var(--muted)}
.log{margin:0;padding:16px;border-radius:12px;background:#050a07;border:1px solid var(--line);font:13px/1.6 ui-monospace,Consolas,monospace;color:#b6f5c9;white-space:pre-wrap}

/* ===== Explore ===== */
.page-head h1{font-size:2.2rem;margin:0 0 6px}
.page-head p{margin:0 0 20px;font-weight:600;display:inline-block}
.ex-controls{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{position:relative;cursor:pointer}
.pill input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.pill span{display:block;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);font-weight:700;font-size:.85rem;transition:transform .4s var(--spring),background .2s,color .2s}
.pill:hover span{transform:scale(1.06);border-color:var(--a2)}
.pill:has(input:checked) span{background:linear-gradient(90deg,var(--a1),var(--a2));color:var(--ink);border-color:transparent}
.pill:has(input:focus-visible) span{outline:2px solid var(--a2);outline-offset:2px}
.ex-note{min-height:1.4em;margin:4px 0 14px;color:var(--muted);font-size:.88rem}
.mod-grid{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.mod-card{position:relative;display:grid;grid-template-columns:auto 54px 1fr;gap:14px;align-items:start;padding:16px;background:var(--panel2);border:1px solid var(--line);border-radius:16px;
  opacity:0;transform:translateY(34px) scale(.95);
  transition:opacity .6s var(--ease) var(--d,0ms),transform .6s var(--ease) var(--d,0ms),border-color .25s,box-shadow .25s}
.mod-card.visible{opacity:1;transform:none}
.mod-card:hover,.mod-card:focus-within{border-color:rgba(56,189,248,.45);box-shadow:0 12px 30px -16px var(--a2)}
.mod-check{width:20px;height:20px;margin:17px 0 0;accent-color:var(--a1);cursor:pointer}
.mod-icon{width:54px;height:54px}
.mod-icon svg{width:100%;height:100%;display:block}
.mod-info{min-width:0}
.mod-name{margin:0 0 2px;font-size:1.05rem}
.mod-meta{margin:0 0 6px;font-size:.8rem;color:var(--muted)}
.mod-sum{margin:0}
.badge-added{display:inline-block;margin-top:8px;font-size:.72rem;font-weight:800;padding:3px 10px;border-radius:999px;background:rgba(34,197,94,.16);color:#86efac}
.badge-ext{display:inline-block;margin-top:8px;font-size:.72rem;font-weight:800;padding:3px 10px;border-radius:999px;background:rgba(234,179,8,.15);color:#fde68a}
.mod-tools{position:absolute;top:10px;right:10px;display:flex;gap:4px;padding:4px;background:#0b1510;border:1px solid var(--line2);border-radius:11px;box-shadow:0 8px 20px rgba(0,0,0,.4);
  opacity:0;transform:translateY(-4px) scale(.94);pointer-events:none;transition:opacity .2s,transform .35s var(--spring)}
.mod-card:hover .mod-tools,.mod-card:focus-within .mod-tools{opacity:1;transform:none;pointer-events:auto}
.tool-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:8px;border:0;background:none;color:var(--text);font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;transition:background .2s,transform .35s var(--spring)}
.tool-btn svg{width:15px;height:15px}
.tool-btn:hover:not(:disabled){background:rgba(255,255,255,.08);transform:scale(1.07)}
.tool-btn:disabled{opacity:.55;cursor:default}
.tool-add{color:#86efac}
.addbar{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding:12px 16px;border-radius:16px;background:rgba(14,25,19,.94);backdrop-filter:blur(8px);border:1px solid var(--line2);transition:border-color .3s,box-shadow .3s}
.addbar.lit{border-color:var(--a1);box-shadow:0 0 0 1px var(--a1),0 14px 34px -12px var(--a1)}
.addbar span{font-weight:700;color:var(--muted)}
.addbar.lit span{color:var(--text)}

/* Mod details */
.detail-head{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin:18px 0 6px}
.detail-icon{width:84px;height:84px;flex:none;animation:floaty 4s ease-in-out infinite}
.detail-icon svg{width:100%;height:100%;display:block}
.detail-head h1{margin:0 0 4px;font-size:2rem}
.detail-head>div:nth-child(2){flex:1;min-width:200px}
.desc h3{font-size:1rem;margin:18px 0 6px}
.desc ul{margin:0;padding-left:20px}
.desc p{margin:0}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:0}
.shots figure{margin:0}
.shot-img{aspect-ratio:16/9;border-radius:12px;border:1px solid var(--line2);position:relative;overflow:hidden}
.shot-img::after{content:'';position:absolute;left:0;right:0;bottom:0;height:38%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 18px,rgba(0,0,0,.05) 18px 36px)}
.shots figcaption{margin-top:6px;font-size:.85rem;color:var(--muted);font-weight:600}
.ver-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ver-list li{padding:10px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.ver-list strong{display:block}

/* ===== Settings ===== */
.set-grid{display:grid;gap:16px;max-width:760px}
.switch{display:inline-flex;align-items:center;gap:12px;cursor:pointer;font-weight:700}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch-ui{width:46px;height:26px;border-radius:999px;background:#334139;position:relative;transition:background .25s;flex:none}
.switch-ui::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .45s var(--spring)}
.switch input:checked+.switch-ui{background:linear-gradient(90deg,var(--a1),var(--a2))}
.switch input:checked+.switch-ui::after{transform:translateX(20px)}
.switch input:focus-visible+.switch-ui{outline:2px solid var(--a2);outline-offset:3px}
.loader-stage{display:grid;place-items:center;height:190px;margin:14px 0;border-radius:14px;background:#050a07;border:1px solid var(--line)}
.tools-row{display:flex;gap:10px;flex-wrap:wrap}

/* ===== Lost page ===== */
.lost{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:30px 10px}
.lost>svg{width:min(520px,100%);height:auto}
.lost h1{font-size:2rem;margin:14px 0 0}
.lost p{margin:0 0 14px;font-size:1.1rem;font-weight:600}
.flicker{animation:flicker 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flicker{0%,100%{opacity:1;transform:scale(1)}30%{opacity:.75;transform:scale(.92,1.05)}60%{opacity:.95;transform:scale(1.05,.95)}}
.mist{animation:mist 9s ease-in-out infinite}
@keyframes mist{0%,100%{transform:translateX(0)}50%{transform:translateX(24px)}}

/* ===== Dialogs ===== */
dialog.dlg{border:1px solid var(--line2);border-radius:20px;background:#111c15;color:var(--text);padding:28px;width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.65)}
dialog.dlg[open]{animation:dlgPop .4s var(--spring)}
@keyframes dlgPop{from{opacity:0;transform:scale(.9) translateY(12px)}to{opacity:1;transform:none}}
dialog.dlg::backdrop{background:rgba(0,0,0,.66);backdrop-filter:blur(4px);animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
dialog.dlg.wide{width:min(700px,calc(100vw - 32px))}
dialog.dlg h2{margin:0 0 10px;font-size:1.45rem}
dialog.dlg p{margin:0 0 6px}
dialog.dlg.warning{background:#2a2104;border-color:#a16207;box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 0 1px rgba(234,179,8,.2)}
.warn-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.warn-head svg{width:34px;height:34px;flex:none;color:#facc15}
.warn-title{color:#fde68a;margin:0!important}
.warning p{color:#fef3c7}
.warning strong{color:#fca5a5}
.aff-list{margin:10px 0 0;padding:10px 14px 10px 32px;border-radius:10px;background:rgba(0,0,0,.25);color:#fef3c7}
.dlg-badge{width:56px;height:56px;margin-bottom:12px;border-radius:14px;overflow:hidden;animation:floaty 4s ease-in-out infinite}
.dlg-badge svg{width:100%;height:100%;display:block}
.dlg-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:22px}
.dropzone{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin-top:10px;padding:26px 16px;border:2px dashed var(--line2);border-radius:16px;transition:border-color .2s,background .2s,transform .4s var(--spring)}
.dropzone svg{width:110px;height:auto}
.dropzone.over{border-color:var(--a1);background:rgba(34,197,94,.08);transform:scale(1.02)}
.dz-text{font-size:1.1rem;font-weight:800}
.dz-arrow{animation:dzDrop 1.4s ease-in-out infinite}
@keyframes dzDrop{0%,100%{transform:translateY(-4px)}50%{transform:translateY(5px)}}

/* ===== Toast + loading overlay ===== */
.toast{position:fixed;left:50%;bottom:66px;transform:translate(-50%,20px);z-index:90;padding:12px 20px;border-radius:14px;background:#13241a;border:1px solid var(--a1);box-shadow:0 14px 36px -10px var(--a1);font-weight:700;max-width:min(560px,90vw);text-align:center;opacity:0;visibility:hidden;transition:opacity .25s,transform .45s var(--spring),visibility .25s}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
.loading{position:fixed;inset:0;z-index:80;display:grid;place-items:center;align-content:center;gap:10px;background:rgba(6,12,8,.95);opacity:0;transition:opacity .25s}
.loading.show{opacity:1}
.loading[hidden]{display:none}
.ld-text{margin:0;font-weight:800;font-size:1.05rem}

/* ===== Loader animations ===== */
.ld{position:relative;width:140px;height:140px}
.ld svg{width:100%;height:100%;display:block}
.ld-default svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-flip .ld-tool{width:100%;height:100%;animation:flip 2.4s cubic-bezier(.5,0,.3,1) infinite}
@keyframes flip{0%{transform:rotate(0) scale(1)}15%{transform:rotate(-18deg) scale(.82)}25%{transform:rotate(194deg) scale(1.06)}31%,50%{transform:rotate(180deg) scale(1)}65%{transform:rotate(162deg) scale(.82)}75%{transform:rotate(374deg) scale(1.06)}81%,100%{transform:rotate(360deg) scale(1)}}
.ld-tap .ld-tool{position:absolute;inset:10px;transform-origin:24% 76%;animation:tap 1.1s ease-in infinite}
@keyframes tap{0%,100%{transform:rotate(-45deg)}40%{transform:rotate(10deg)}48%{transform:rotate(3deg)}}
.ld-sparks i{position:absolute;left:74%;top:64%;width:7px;height:7px;background:var(--a2);opacity:0;animation:spark1 1.1s ease-out infinite}
.ld-sparks i:nth-child(2){background:var(--a1);animation-name:spark2}
.ld-sparks i:nth-child(3){background:#fde68a;animation-name:spark3}
@keyframes spark1{0%,38%{opacity:0;transform:translate(0,0)}42%{opacity:1}75%,100%{opacity:0;transform:translate(18px,-24px)}}
@keyframes spark2{0%,38%{opacity:0;transform:translate(0,0)}42%{opacity:1}75%,100%{opacity:0;transform:translate(-6px,-30px)}}
@keyframes spark3{0%,38%{opacity:0;transform:translate(0,0)}42%{opacity:1}75%,100%{opacity:0;transform:translate(24px,-4px)}}
.ld-mine .ld-block{position:absolute;left:4px;bottom:4px;width:74px;height:74px;animation:shake .5s ease-in-out infinite}
.ld-cracks{position:absolute;left:22%;right:22%;top:46%;bottom:18%;background:repeating-linear-gradient(60deg,transparent 0 8px,rgba(0,0,0,.6) 8px 10px);opacity:0;animation:cracks 2s steps(4) infinite}
@keyframes cracks{from{opacity:0}to{opacity:1}}
@keyframes shake{0%,100%{transform:translate(0)}50%{transform:translate(1px,1px)}}
.ld-mine .ld-tool{position:absolute;right:0;top:0;width:88px;height:88px;transform-origin:70% 30%;animation:mine .5s ease-in infinite}
@keyframes mine{0%,100%{transform:rotate(28deg)}45%{transform:rotate(-26deg)}}
.ld-bits i{position:absolute;left:30%;top:58%;width:6px;height:6px;background:#9ca3af;opacity:0;animation:bit 1s ease-out infinite}
.ld-bits i:nth-child(1){--x:-26px;--y:-20px}
.ld-bits i:nth-child(2){--x:18px;--y:-30px;animation-delay:.25s}
.ld-bits i:nth-child(3){--x:-10px;--y:-36px;animation-delay:.5s;background:#d1d5db}
.ld-bits i:nth-child(4){--x:26px;--y:-12px;animation-delay:.75s}
@keyframes bit{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--x),var(--y))}}
.ld-grass .ld-hop{position:absolute;left:32px;right:32px;top:26px;height:76px;animation:hop 1.6s cubic-bezier(.4,0,.4,1) infinite}
@keyframes hop{0%{transform:translateY(0) scale(1.14,.84)}12%{transform:translateY(0) scale(1)}50%{transform:translateY(-40px) rotate(180deg)}85%{transform:translateY(0) rotate(360deg)}92%{transform:translateY(0) rotate(360deg) scale(1.14,.84)}100%{transform:translateY(0) rotate(360deg) scale(1)}}
.ld-shadow{position:absolute;left:40px;right:40px;bottom:14px;height:10px;border-radius:50%;background:rgba(0,0,0,.55);animation:shadow 1.6s cubic-bezier(.4,0,.4,1) infinite}
@keyframes shadow{0%,12%,85%,100%{transform:scaleX(1);opacity:.8}50%{transform:scaleX(.55);opacity:.35}}

/* ===== v2: header actions, Quick Play bar, Content layout ===== */
.hero-actions{display:flex;align-items:center;gap:10px}
.icon-btn{width:54px;height:54px;padding:0;border-radius:50%}
.icon-btn svg{width:24px;height:24px}
.qbar{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;margin-top:14px;padding:10px 12px;border-radius:16px;background:var(--panel2);border:1px solid var(--line)}
.qbar-label{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 4px}
.qbar-label svg{width:16px;height:16px;color:var(--a1)}
.qbar ul{list-style:none;margin:0;padding:0;display:flex;gap:8px;flex-wrap:wrap;flex:1}
.qbar-empty{flex:1;margin:0;color:var(--muted);font-size:.88rem}
.chip{padding:6px 14px 6px 6px}
.chip-kind,.qp-kind{font-size:.68rem;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(56,189,248,.16);color:#7dd3fc}
.chip-kind.Server,.qp-kind.Server{background:rgba(168,85,247,.2);color:#d8b4fe}
.qp-addr{font-size:.78rem;color:var(--muted);font-family:ui-monospace,Consolas,monospace;font-weight:500}
.content-grid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;align-items:start}
@media (max-width:1150px){.content-grid{grid-template-columns:1fr}}
.srv-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.srv-row .field{flex:1;min-width:150px}
.dlg-sub{margin:-4px 0 14px!important;color:var(--muted);font-weight:600}

/* ===== v3: Home dashboard ===== */
.welcome .hero-text h1{font-size:2rem}
.welcome-head{width:72px;height:72px;border-radius:16px;overflow:hidden;flex:none;animation:floaty 4s ease-in-out infinite;box-shadow:0 0 0 2px rgba(34,197,94,.5)}
.welcome-head svg{width:100%;height:100%;display:block}
.dash-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}
@media (max-width:1000px){.dash-grid{grid-template-columns:1fr}}
.dash-chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chip-icon{width:22px;height:22px;display:block;flex:none}
.chip-icon svg,.chip-icon img{width:100%;height:100%;display:block;border-radius:5px}
.chip-sub{color:var(--muted);font-weight:600}
.chip-sub::before{content:'· '}
.upd-list{list-style:none;margin:10px 0 14px;padding:0;display:grid;gap:8px}
.upd-list li{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;background:var(--panel3)}
.feat-grid{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.feat-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:16px;background:var(--panel3);border:1px solid var(--line);transition:transform .45s var(--spring),border-color .25s,box-shadow .25s}
.feat-card:hover,.feat-card:focus-within{transform:translateY(-4px) scale(1.02);border-color:var(--a1);box-shadow:0 14px 30px -14px var(--a1)}
.feat-card p{flex:1;margin:0}
.feat-icon{width:46px;height:46px}.feat-icon svg{width:100%;height:100%;display:block}
.news-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.news-list article{padding:12px 14px;border-radius:12px;background:var(--panel3);border-left:3px solid var(--h2)}
.news-list h3,.news-list h4{margin:2px 0 4px;font-size:1rem}
.news-list p{margin:0}
.news-date{font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.badge-upd{display:inline-block;margin-left:8px;font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:999px;background:rgba(56,189,248,.16);color:#7dd3fc;vertical-align:middle}

/* ===== v4: widgets ===== */
.w-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.w-head h2{margin:0!important}
.w-tools{display:flex;gap:4px}
.w-tool{position:relative;overflow:hidden;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line2);background:var(--panel3);color:var(--text);cursor:pointer;transition:transform .35s var(--spring),border-color .2s,background .2s}
.w-tool svg{width:17px;height:17px}
.w-tool:hover:not(:disabled){transform:scale(1.1);border-color:var(--a2)}
.w-tool:disabled{opacity:.3;cursor:not-allowed}
.w-remove:hover:not(:disabled){border-color:var(--danger);background:rgba(239,68,68,.15)}
.dash-grid.editing .widget{outline:2px dashed rgba(56,189,248,.35);outline-offset:4px}
.add-widget{min-height:110px;border-radius:16px!important;border:2px dashed var(--line2)!important;justify-content:center}
.edit-hint{margin:14px 0 0;color:#7dd3fc;font-weight:700}
.add-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.add-list li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.w-sub{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
.w-sub:first-child{margin-top:0}
.news-link{display:inline-block;margin-top:6px;font-weight:700;color:#7dd3fc}
/* Quick Play tiles */
.qp-tiles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.qtile{min-width:0;display:flex;flex-direction:column}
.qtile .qthumb{order:-1}
.qthumb{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;border:1px solid var(--line2);transition:transform .45s var(--spring),box-shadow .25s}
.qtile:hover .qthumb,.qtile:focus-within .qthumb{transform:translateY(-3px);box-shadow:0 12px 26px -12px var(--a1)}
.qthumb>svg{width:100%;height:100%;display:block}
.qinst{position:absolute;left:6px;bottom:6px;width:26px;height:26px;border-radius:7px;overflow:hidden;background:rgba(0,0,0,.55);display:grid;place-items:center}
.qinst svg,.qinst img{width:22px;height:22px;display:block}
.qplay{position:absolute;inset:0;display:grid;place-items:center;border:0;padding:0;background:rgba(5,10,7,.5);cursor:pointer;opacity:0;transition:opacity .2s}
.qtile:hover .qplay,.qplay:focus-visible{opacity:1}
.qplay:focus-visible{outline:2px solid var(--a2);outline-offset:-3px}
.qplay-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--ink);transform:scale(.6);transition:transform .45s var(--spring)}
.qtile:hover .qplay-ic,.qplay:focus-visible .qplay-ic{transform:scale(1)}
.qplay-ic svg{width:20px;height:20px}
.qpin{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(5,10,7,.75);color:#fff;cursor:pointer;opacity:0;transition:opacity .2s,transform .35s var(--spring)}
.qpin svg{width:15px;height:15px}
.qtile:hover .qpin,.qtile:focus-within .qpin,.qpin.on{opacity:1}
.qpin:hover{transform:scale(1.12)}
.qpin.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--ink)}
.qname{margin:7px 0 2px;font-weight:700;font-size:.9rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qmeta{margin:0;display:flex;gap:6px;align-items:center;font-size:.75rem;color:var(--muted)}
.mode-tag{font-size:.64rem;font-weight:800;padding:2px 7px;border-radius:999px;background:rgba(34,197,94,.18);color:#86efac}
.mode-tag.Creative{background:rgba(234,179,8,.18);color:#fde68a}
.mode-tag.Server{background:rgba(168,85,247,.2);color:#d8b4fe}
/* small lists, bars, extras */
.mini-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mini-list li{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;background:var(--panel3)}
.mini-list .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.mini-thumb{width:46px;height:29px;border-radius:6px;overflow:hidden;flex:none}
.mini-thumb svg{width:100%;height:100%;display:block}
.bd-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bars{list-style:none;margin:10px 0;padding:0;display:grid;gap:8px}
.bars li{display:grid;grid-template-columns:minmax(0,130px) 1fr 52px;align-items:center;gap:10px;font-size:.85rem;font-weight:700}
.bars li>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.bar span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--a1),var(--a2))}
.shot-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.shot-grid figure{margin:0}.shot-grid svg{width:100%;aspect-ratio:16/10;height:auto;display:block;border-radius:10px}
.shot-grid figcaption{font-size:.78rem;color:var(--muted);font-weight:600;margin-top:4px}
.dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;flex:none}
.dot.off{background:#64748b;box-shadow:none}
.clock{font-size:2.6rem;font-weight:800;margin:0;font-variant-numeric:tabular-nums;line-height:1.1}
.weather{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-weight:700}
.weather svg{width:22px;height:22px;color:#fde047}
.seed{font-family:ui-monospace,Consolas,monospace;font-size:1.15rem;font-weight:700;margin:0 0 10px;word-break:break-all}
.notes-box{width:100%;min-height:120px;resize:vertical}
.tip-text{margin:0 0 12px;font-weight:600}
.skin-stage{display:grid;place-items:center;height:170px;perspective:400px}
.skin-stage svg{height:150px;width:auto;animation:skinSpin 6s ease-in-out infinite}
@keyframes skinSpin{0%,100%{transform:rotateY(-28deg)}50%{transform:rotateY(28deg)}}
/* pinned worlds + icon backgrounds in the instance bar */
.inst-btn.has-bg,.inst-btn.has-bg:hover,.inst-btn.has-bg:focus-visible,.inst-item.is-selected .inst-btn.has-bg{background:var(--ibg)}
.world-btn,.world-btn:hover,.world-btn:focus-visible{border-radius:12px;background:#000}
.world-btn svg{width:100%!important;height:100%!important}
.world-btn:hover svg{transform:scale(1.08)}
/* ===== v4: new-instance wizard ===== */
.wiz-prog{margin:8px 0 6px}
.progress.wiz-bar{width:100%;height:10px}
.wiz-steps{list-style:none;margin:10px 0 0;padding:0;display:flex;justify-content:space-between;gap:8px}
.wiz-steps li{display:flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;color:var(--muted)}
.wiz-steps li.current{color:var(--text)}
.wiz-steps li.current::before{content:'';width:8px;height:8px;border-radius:50%;background:linear-gradient(var(--a1),var(--a2));box-shadow:0 0 8px var(--a1)}
.wiz-steps li.done{color:#86efac}
.wiz-steps svg{width:14px;height:14px}
.icon-builder{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:14px;border-radius:16px;background:var(--panel2);border:1px solid var(--line)}
.icon-preview-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:150px;text-align:center}
.icon-preview{width:96px;height:96px;display:grid;place-items:center}
.icon-preview svg,.icon-preview img{width:96px;height:96px;display:block;border-radius:14px}
.icon-preview.spin{animation:roll .65s var(--spring)}
@keyframes roll{from{transform:rotate(-220deg) scale(.5)}to{transform:none}}
.icon-preview-wrap p{margin:0}
.icon-ctls{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.bg-wrap{position:relative}
.bg-dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:var(--bgc,transparent);flex:none}
.bg-dot.none{background:repeating-linear-gradient(45deg,#334155 0 3px,transparent 3px 6px)}
.bg-panel{position:absolute;left:0;top:calc(100% + 8px);z-index:5;display:grid;grid-template-columns:repeat(7,30px);gap:7px;padding:10px;border-radius:14px;background:#0b1510;border:1px solid var(--line2);box-shadow:0 14px 30px rgba(0,0,0,.5);animation:ctxIn .25s var(--spring)}
.bg-panel[hidden]{display:none}
.sw{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.15);background:var(--c);cursor:pointer;transition:transform .3s var(--spring)}
.sw:hover{transform:scale(1.15)}
.sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px var(--a1)}
.sw-wheel{background:conic-gradient(#ef4444,#eab308,#22c55e,#38bdf8,#3b82f6,#a855f7,#ef4444)}
.picker-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.picker-tabs{margin:0!important}
#iconSearch{flex:1;min-width:160px;max-width:280px}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px;max-height:232px;overflow-y:auto;padding:8px;border-radius:14px;background:#0a140e;border:1px solid var(--line)}
.slot{position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.04);border:2px solid transparent;cursor:pointer;transition:transform .35s var(--spring),background .2s,border-color .2s}
.slot input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.slot-ic{pointer-events:none}
.slot-ic svg,.slot-ic img{width:32px;height:32px;display:block;border-radius:6px}
.slot:hover{background:rgba(56,189,248,.12);transform:scale(1.08)}
.slot:has(input:checked){border-color:var(--a1);background:rgba(34,197,94,.14)}
.slot:has(input:focus-visible){outline:2px solid var(--a2);outline-offset:1px}
.classic-toggle{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:6px 4px;border:0;background:none;color:var(--text);font:inherit;font-weight:800;cursor:pointer}
.classic-toggle svg{width:16px;height:16px;transition:transform .35s var(--spring)}
.classic-toggle[aria-expanded="true"] svg{transform:rotate(90deg)}
#classicBox .slot-grid{max-height:none;margin:8px 0 10px}

/* ===== v5: pills everywhere ===== */
.tab,.tabs::before,.w-tool,.tool-btn,.ctx-item,.pop-btn{border-radius:999px}
.tabs{background:none;padding:0;gap:8px}
.tab{box-shadow:inset 0 0 0 1.5px var(--line2)}
.tab[aria-selected="true"],.tab[aria-pressed="true"]{box-shadow:none;color:var(--ink)}
.tab[aria-pressed="true"]:hover{color:var(--ink);filter:none}

/* ===== v5: gradient rings (outline that fills in from the left) ===== */
:root{--d1:#ef4444;--d2:#f97316}
.btn-danger,.x-btn{--ring:linear-gradient(90deg,var(--d1),var(--d2))}
body.outlined .btn-primary{--ring:linear-gradient(90deg,var(--a1),var(--a2))}
body.outlined .btn-secondary{--ring:linear-gradient(90deg,var(--h1),var(--h2))}
body.outlined .btn-ghost{--ring:var(--line2)}
.btn-danger::after,.x-btn::after,body.outlined .btn-primary::after,body.outlined .btn-secondary::after,body.outlined .btn-ghost::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:2px;background:var(--ring);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none}
.btn-danger{border-color:transparent;color:#fca5a5;background:linear-gradient(90deg,var(--d1),var(--d2)) left/0% 100% no-repeat}
.btn-danger:hover:not(:disabled),.btn-danger:focus-visible{color:#fff;background:linear-gradient(90deg,var(--d1),var(--d2)) left/100% 100% no-repeat;box-shadow:0 8px 24px -8px var(--d1)}
body.outlined .btn-primary{color:#86efac;background:linear-gradient(90deg,var(--a1),var(--a2)) left/0% 100% no-repeat}
body.outlined .btn-primary:hover:not(:disabled),body.outlined .btn-primary:focus-visible{color:var(--ink);background:linear-gradient(90deg,var(--a1),var(--a2)) left/100% 100% no-repeat}
body.outlined .btn-secondary{border-color:transparent;color:#93c5fd;background:linear-gradient(90deg,var(--h1),var(--h2)) left/0% 100% no-repeat}
body.outlined .btn-secondary:hover:not(:disabled),body.outlined .btn-secondary:focus-visible{border-color:transparent;color:#fff;background:linear-gradient(90deg,var(--h1),var(--h2)) left/100% 100% no-repeat}
body.outlined .btn-ghost{border-color:transparent;background:linear-gradient(90deg,rgba(255,255,255,.13),rgba(255,255,255,.13)) left/0% 100% no-repeat}
body.outlined .btn-ghost:hover:not(:disabled),body.outlined .btn-ghost:focus-visible{background:linear-gradient(90deg,rgba(255,255,255,.13),rgba(255,255,255,.13)) left/100% 100% no-repeat}
.x-btn{position:relative;overflow:hidden;width:42px;height:42px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;background:linear-gradient(90deg,var(--d1),var(--d2)) left/0% 100% no-repeat;transition:background-size .4s var(--ease),transform .45s var(--spring)}
.x-btn svg{width:18px;height:18px}
.x-btn svg path{stroke:url(#gradDanger);transition:stroke .2s}
.x-btn:hover,.x-btn:focus-visible{background:linear-gradient(90deg,var(--d1),var(--d2)) left/100% 100% no-repeat;transform:scale(1.08)}
.x-btn:hover svg path,.x-btn:focus-visible svg path{stroke:#fff}

/* ===== v5: compact new-instance wizard ===== */
.wiz-head{display:grid;grid-template-columns:minmax(96px,auto) 1fr auto;align-items:start;gap:14px}
.wiz-mid{min-width:0}
.wiz-mid h2{margin:0 0 8px!important;text-align:center}
.wiz-right{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.name-row{display:flex;gap:14px;align-items:flex-end}
.name-row .field{flex:1}
.icon-preview.sm,.icon-preview.sm svg,.icon-preview.sm img{width:58px;height:58px;border-radius:12px}
.icon-ctls.row{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px}

/* ===== v5: widget pages ===== */
.w-head h2{font-size:inherit}
.w-title{display:inline-flex;align-items:center;gap:6px;padding:2px 0;border:0;background:none;font:inherit;font-size:1.1rem;font-weight:800;cursor:pointer;color:var(--muted)}
.w-title svg{width:16px;height:16px;transition:transform .35s var(--spring)}
.w-title:hover svg,.w-title:focus-visible svg{transform:translateX(4px)}
.stat-row{display:flex;gap:28px;flex-wrap:wrap;margin:18px 0 6px}
.stat{display:flex;flex-direction:column}
.stat-num{font-size:2rem;font-weight:800;line-height:1.1}
.collections{display:grid;gap:16px}
.tip-list{margin:0;padding-left:22px;display:grid;gap:10px}
.forecast{list-style:none;margin:12px 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.forecast li{padding:12px;border-radius:12px;background:var(--panel3);text-align:center;font-weight:700;display:flex;flex-direction:column;gap:4px}
.srv-head{display:flex;align-items:center;gap:10px}.srv-head h2{margin:0!important}
.spark{width:100%;height:60px;margin:6px 0 12px;display:block}.spark rect{fill:var(--a2)}
.legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.lg{width:12px;height:12px;border-radius:3px;display:inline-block;margin-left:6px}
.lg.w,.stack .w{background:var(--a1)}.lg.m,.stack .m{background:var(--h1)}.lg.c,.stack .c{background:var(--h2)}
.disk-list{list-style:none;margin:12px 0;padding:0;display:grid;gap:10px}
.disk-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--panel3)}
.disk-list .grow{display:flex;flex-direction:column}
.disk-list .stack{grid-row:2;grid-column:1;display:flex;height:10px;border-radius:999px;overflow:hidden;min-width:20px}
.disk-list .btn{grid-row:1/3;grid-column:2}
.craft-wrap{display:flex;align-items:center;gap:16px;margin:8px 0}
.craft-grid{display:grid;grid-template-columns:repeat(3,40px);gap:4px}
.craft-grid span,.craft-out{width:40px;height:40px;border-radius:8px;background:#0a140e;border:1px solid var(--line2);display:grid;place-items:center}
.craft-out{width:58px;height:58px}.craft-out svg{width:40px;height:40px}
.craft-arrow{font-size:1.6rem;color:var(--muted)}
.shot-viewer .shot-big svg{width:100%;height:auto;aspect-ratio:16/9;display:block;border-radius:14px}
.shot-pick{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.shot-btn{display:block;width:100%;padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;cursor:pointer;background:none;transition:transform .35s var(--spring),border-color .2s}
.shot-btn svg{width:100%;aspect-ratio:16/10;height:auto;display:block}
.shot-btn:hover{transform:scale(1.05)}
.shot-btn[aria-pressed="true"]{border-color:var(--a1)}
.notes-page{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start}
@media (max-width:1000px){.notes-page,.skin-page{grid-template-columns:1fr!important}}
.folder-list{display:flex;flex-direction:column;gap:8px}
.folder-list .tab{text-align:left}
.folder-list .tab[aria-pressed="true"]{background:linear-gradient(90deg,var(--a1),var(--a2))}
.notes-box.tall{min-height:320px;margin-top:8px}
.h-label{display:inline-block;font-size:1.1rem;font-weight:800}
.upd-row{display:flex;flex-direction:column;gap:6px}
.upd-check{display:flex;align-items:center;gap:12px;cursor:pointer}
.upd-check input{width:18px;height:18px;accent-color:var(--a1)}
.changelog summary{cursor:pointer;font-size:.85rem;font-weight:700;color:#7dd3fc}
.changelog ul{margin:6px 0 0;padding-left:20px;font-size:.85rem;color:var(--muted)}
/* skins */
.skin-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.skin-chip{position:relative;overflow:hidden;width:46px;height:46px;padding:5px;border-radius:999px;border:2px solid var(--line2);background:var(--panel3);cursor:pointer;transition:transform .35s var(--spring),border-color .2s}
.skin-chip:hover{transform:scale(1.1)}
.skin-chip[aria-pressed="true"]{border-color:var(--a1);box-shadow:0 0 12px -2px var(--a1)}
.skin-head{display:block;width:100%;height:100%;border-radius:999px;overflow:hidden}
.skin-head svg{width:100%;height:100%;display:block}
.headimg{display:block;image-rendering:pixelated;background-repeat:no-repeat}
.skin-head .headimg{width:32px!important;height:32px!important}
.skin-page{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:16px;align-items:start}
.skin-stage.big{height:300px}.skin-stage.big svg{height:270px}
.skin-flat{width:160px;height:160px;image-rendering:pixelated;border-radius:10px;background:#0a140e}
.skin-list{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
.skin-list li{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:14px;background:var(--panel3);border:1px solid var(--line)}
.skin-list li.on{border-color:var(--a1)}
.skin-list .grow{flex:1;display:flex;flex-direction:column;align-items:flex-start}
.skin-thumb{width:36px;height:60px;flex:none;display:grid;place-items:center}
.skin-thumb svg{height:60px;width:auto;animation:none!important}.skin-thumb img{width:40px;height:40px;image-rendering:pixelated}

/* ===== Tooltip ===== */
.tip{position:fixed;left:0;top:0;z-index:120;padding:8px 12px;border-radius:10px;background:#050a07;border:1px solid var(--line2);box-shadow:0 10px 26px rgba(0,0,0,.5);font-weight:800;font-size:.9rem;white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-6px,-50%) scale(.96);transition:opacity .15s,transform .3s var(--spring)}
.tip.show{opacity:1;transform:translate(0,-50%)}
.tip small{display:block;font-weight:600;font-size:.76rem;color:var(--muted)}
.tip::before{content:'';position:absolute;left:-6px;top:50%;width:10px;height:10px;background:#050a07;border-left:1px solid var(--line2);border-bottom:1px solid var(--line2);transform:translateY(-50%) rotate(45deg)}
.tip.below{transform:translateY(-4px) scale(.96)}
.tip.below.show{transform:none}
.tip.below::before{display:none}

/* ===== Right-click menu ===== */
.ctx{position:fixed;z-index:130;min-width:230px;padding:6px;border-radius:14px;background:#0b1510;border:1px solid var(--line2);box-shadow:0 18px 40px rgba(0,0,0,.55);animation:ctxIn .25s var(--spring);transform-origin:top left}
.ctx[hidden]{display:none}
@keyframes ctxIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.ctx-title{padding:6px 10px 4px;font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ctx-item{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:9px;background:none;color:var(--text);font:inherit;font-weight:700;text-align:left;cursor:pointer;transition:background .15s}
.ctx-item svg{width:17px;height:17px;flex:none;color:var(--a1)}
.ctx-item:hover,.ctx-item:focus{background:linear-gradient(90deg,rgba(34,197,94,.22),rgba(56,189,248,.14));outline:none}
.ctx-item[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.ctx-note{padding:0 10px 6px 37px;font-size:.78rem;color:#fde68a}
.ctx-sep{height:1px;background:var(--line);margin:4px 6px}

/* ===== Click ripple ===== */
.ripple-wrap{position:fixed;z-index:150;overflow:hidden;pointer-events:none}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:ripple .6s ease-out forwards}
@keyframes ripple{to{transform:scale(1);opacity:0}}

/* ===== Progress shine ===== */
.progress{width:min(320px,70vw);height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.progress-fill{position:relative;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--a1),var(--a2));overflow:hidden}
.progress-fill::after{content:'';position:absolute;top:0;left:-60%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:shine 1.3s ease-in-out infinite}
@keyframes shine{to{left:130%}}

/* ===== Reduce animations ===== */
.reduce-motion *,.reduce-motion *::before,.reduce-motion *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
.reduce-motion .btn::before{display:none}
.reduce-motion .btn:hover:not(:disabled),.reduce-motion .btn:active:not(:disabled){transform:none}
.reduce-motion .mod-card{opacity:1;transform:none}
.reduce-motion .ld{animation:pulseSlow 2.2s ease-in-out infinite!important}
.reduce-motion .ld *{animation:none!important}
.reduce-motion .loading{transition:none}
@keyframes pulseSlow{0%,100%{opacity:.5}50%{opacity:1}}

@media (max-width:980px){.shell{grid-template-columns:76px 1fr 80px}#content{padding:20px}.inst-hero{flex-wrap:wrap}}

/* ===== v7 ===== */
/* Mouse hover: icons and decorations let the pointer through, so assistive tech lands on the button itself */
.inst-btn>*,.tab>*,.btn>*,.qplay>*,.chip>*,.rn-btn>*,.skin-chip>*,.slot>*{pointer-events:none}
.tabs::before{pointer-events:none}
/* Homepage background: the streaky glow, stretched across the whole page */
.home-sec{margin:-28px -34px -40px;padding:28px 34px 40px}
.home-beams{position:sticky;top:0;height:0;z-index:0;pointer-events:none}
.home-beams::before,.home-beams::after{content:'';position:absolute;left:0;right:0;top:0;height:calc(100vh - 108px)}
.home-beams::after{z-index:-1;background:linear-gradient(180deg,#050a07,#08120c)}
.home-beams::before{background:
  linear-gradient(115deg,transparent 44%,rgba(59,130,246,.42) 47%,transparent 51%),
  linear-gradient(65deg,transparent 28%,rgba(34,197,94,.36) 31%,transparent 35%),
  linear-gradient(100deg,transparent 68%,rgba(168,85,247,.36) 71%,transparent 75%),
  linear-gradient(122deg,transparent 12%,rgba(56,189,248,.18) 14%,transparent 18%),
  linear-gradient(78deg,transparent 52%,rgba(34,197,94,.16) 54%,transparent 58%);
  background-repeat:no-repeat;background-size:150% 100%;filter:blur(5px);animation:beamsBg 14s ease-in-out infinite}
@keyframes beamsBg{0%,100%{background-position:0% 0}50%{background-position:30% 0}}
.home-sec>*:not(.home-beams){position:relative;z-index:1}
.home-sec .inst-hero{background:rgba(5,10,7,.38);border-color:rgba(255,255,255,.14);backdrop-filter:blur(4px)}
.home-sec .inst-hero::before{display:none}
.home-sec .card{background:rgba(19,34,25,.7);backdrop-filter:blur(8px)}
.ctx-item.ctx-danger{color:#fca5a5}.ctx-item.ctx-danger svg{color:#f87171}
/* World details */
.wd-top{margin-bottom:14px}
.wd-thumb{width:128px;height:76px;flex:none;border-radius:14px;overflow:hidden;border:1px solid var(--line2)}
.wd-thumb svg{width:100%;height:100%;display:block}
.wd-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 0;padding:0}
.wd-stats>div{padding:10px 14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
.wd-stats dt{font-size:.72rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.wd-stats dd{margin:2px 0 0;font-weight:800}
.wmap-wrap{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line2);background:#06100a;box-shadow:0 0 0 1px rgba(34,197,94,.14),0 28px 70px -28px rgba(56,189,248,.4)}
.wmap{display:block;width:100%;height:clamp(380px,64vh,760px);cursor:grab;touch-action:none}
.wmap.drag{cursor:grabbing}
.wmap:focus-visible{outline:3px solid var(--a2);outline-offset:-3px}
.wmap-read{position:absolute;left:14px;top:14px;max-width:calc(100% - 90px);padding:8px 16px;border-radius:999px;background:rgba(5,10,7,.8);border:1px solid var(--line2);font-weight:800;backdrop-filter:blur(6px);pointer-events:none}
.wmap-read small{color:var(--muted);font-weight:600;margin-left:8px}
.wmap-ctl{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:8px}
.wmap-ctl .btn{width:44px;height:44px;padding:0;border-radius:50%;font-size:1.4rem;line-height:1}
.wmap-ctl .btn svg{width:22px;height:22px}
.wmap-scale{position:absolute;left:14px;bottom:14px;padding:6px 12px;border-radius:999px;background:rgba(5,10,7,.8);border:1px solid var(--line2);font-size:.78rem;font-weight:800;pointer-events:none;display:flex;align-items:center;gap:8px}
.wmap-scale i{display:block;height:6px;border:2px solid #e8f2ec;border-top:0}
.wmap-compass{position:absolute;right:14px;bottom:14px;width:40px;height:40px;border-radius:50%;background:rgba(5,10,7,.8);border:1px solid var(--line2);display:grid;place-items:center;font-weight:900;color:#fca5a5;pointer-events:none}
.marker-list{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.mk-dot{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.7);flex:none}
.adv-sum{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px}
.adv-sum .bigbar{flex:1;min-width:200px;height:10px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
.adv-sum .bigbar span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--a1),var(--a2))}
.adv-grid{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.adv{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--panel2);border:1px solid var(--line)}
.adv.got{border-color:rgba(34,197,94,.45);background:linear-gradient(135deg,rgba(34,197,94,.13),rgba(56,189,248,.08))}
.adv-frame{flex:none;width:54px;height:54px;display:grid;place-items:center;background:#2b3a31;border:3px solid #6b7d72;border-radius:9px}
.adv.goal .adv-frame{border-radius:28px;border-color:#7dd3fc}
.adv.challenge .adv-frame{border-radius:4px;border-color:#c084fc;clip-path:polygon(14% 0,86% 0,100% 14%,100% 86%,86% 100%,14% 100%,0 86%,0 14%)}
.adv-frame svg{width:30px;height:30px;display:block}
.adv:not(.got) .adv-frame{filter:grayscale(1) brightness(.62)}
.adv:not(.got){opacity:.88}
.adv h3{margin:0 0 2px;font-size:1rem}
.adv p{margin:0;color:var(--muted);font-size:.88rem}
.adv .adv-st{margin-top:6px;font-weight:800;font-size:.82rem;color:var(--muted)}
.adv.got .adv-st{color:#86efac}
.adv-bar{height:6px;border-radius:999px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}
.adv-bar span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--a1),var(--a2))}
.wd-bar{margin:6px 0 0}
</style>
</head>
<body>
<a class="skip" href="#content">Skip to content</a>

<header class="topbar app-region">
  <div class="logo" id="logo"></div>
  <span class="preview-tag">Preview v7</span>
  <button class="acct" id="acctBtn" data-act="account"></button>

function readSkin(input) {
  const file = input.files[0]; input.value = ''; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      if (img.naturalWidth !== 64 || (img.naturalHeight !== 64 && img.naturalHeight !== 32)) { toast('That doesn\'t look like a Minecraft skin. Skins are 64 by 64 PNG files.'); return; }
      const sk = {id:'u' + Date.now().toString(36), name:file.name.replace(/\.png$/i, ''), img:r.result};
      state.skins.push(sk); state.skinId = sk.id; save(); renderAll(); const f = $('#skinUpBtn'); if (f) f.focus();
      toast(`Uploaded ${sk.name} and put it on.`);
    };
    img.onerror = () => toast('Couldn\'t read that image.');
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

function openImport() {
  const i = sel();
  openDialog({describedby:'dlg-desc', focus:'#browseBtn', html:`<h2 id="dlg-title" class="grad-h">Import mods</h2>
<div class="dropzone" id="dropzone">${SVG_FOLDER}<p id="dlg-desc" class="dz-text">Drop files here or click Browse.</p><p class="muted small">.jar mods, or .zip resource packs and shaders, into ${esc(i.name)}.</p></div>
<input type="file" id="fileInput" multiple accept=".jar,.zip" class="sr-only" tabindex="-1" aria-hidden="true">
<div class="dlg-actions"><button class="btn btn-ghost" data-act="dlg-close">Cancel</button><button class="btn btn-primary" id="browseBtn" data-act="browse">${I.folder} Browse</button></div>`});
  const dz = $('#dropzone');
  ['dragenter','dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
  dz.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
  $('#fileInput').addEventListener('change', e => handleFiles(e.target.files));
}
function handleFiles(files) {
  const i = sel(); if (!i) return;
  const added = [], skipped = [];
  [...files].forEach(f => {
    const ext = (f.name.match(/\.(jar|zip)$/i) || [])[1];
    if (!ext || (ext.toLowerCase() === 'jar' && i.loader === 'vanilla')) { skipped.push(f.name); return; }
    const type = ext.toLowerCase() === 'jar' ? 'mod' : (/shader/i.test(f.name) ? 'shader' : 'resourcepack');
    const name = f.name.replace(/\.(jar|zip)$/i, '');
    i.items.push({id:'imp-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, type, imported:true});
    added.push(name);
  });
  closeDialog(); save(); renderAll('importBtn');
  let msg = added.length ? `Imported ${listText(added)}.` : 'Nothing imported.';
  if (skipped.length) msg += ` Skipped ${skipped.length} ${skipped.length === 1 ? 'file' : 'files'}${i.loader === 'vanilla' ? ', since Vanilla can\'t run .jar mods' : ' that weren\'t .jar or .zip'}.`;
  toast(msg);
}

function addMods(ids) {
  const t = target(); if (!t) return;
  const add = [], deps = [];
  ids.forEach(id => {
    const m = MODMAP[id];
    if (!m || m.external || isInstalled(t, id) || add.includes(id) || !works(m, t.loader)) return;
    add.push(id);
    (m.deps || []).forEach(d => { if (!isInstalled(t, d) && !deps.includes(d)) deps.push(d); });
  });
  if (!add.length) return;
  const extra = deps.filter(d => !add.includes(d)), n = add.length + extra.length;
  const fid = document.activeElement && document.activeElement.id;
  let focusTo = null;
  if (fid && fid.startsWith('add-')) focusTo = 'det-' + fid.slice(4);
  else if (fid === 'addChecked') focusTo = 'exploreSearch';
  else if (fid === 'detailAdd') focusTo = 'backBtn';
  runLoading(`Downloading ${n} ${n === 1 ? 'file' : 'files'}…`, 1100, ldStyle()).then(() => {
    [...add, ...extra].forEach(id => { if (!isInstalled(t, id)) t.items.push({id}); });
    save(); renderAll(focusTo);
    const fe = focusTo && document.getElementById(focusTo); if (fe) fe.focus();
    toast(`Added ${listText(add.map(id => MODMAP[id].name))} to ${t.name}.${extra.length ? ` Also added ${listText(extra.map(d => MODMAP[d].name))}, which ${add.length > 1 ? 'they need' : 'it needs'}.` : ''}`);
  });
}

/* ================= Events ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { if (el.tagName === 'A') e.preventDefault(); fn(el, e); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'wizForm') return;
  e.preventDefault(); collectWiz();
  if (wiz.step === 1 && !wiz.name) { wiz.err = 'Give your instance a name first.'; renderWizard(); return; }
  wiz.err = '';
  if (wiz.step < 3) { wiz.step++; renderWizard(); } else createFromWiz();
});
document.addEventListener('change', e => {
  const t = e.target, i = sel();
  if (t.name === 'btnStyle') { state.settings.btnStyle = t.value; save(); applyMotion(); toast(t.value === 'filled' ? 'Filled buttons.' : 'Outlined buttons.'); return; }
  if (t.classList.contains('notify-cb')) { const n = t.dataset.name; t.checked ? ui.notify.add(n) : ui.notify.delete(n); toast(t.checked ? `You'll be told when ${n} comes online (pretend).` : `Notifications off for ${n}.`); return; }
  if (t.id === 'qpSort') { ui.qpSort = t.value; $('#qpAll').innerHTML = qpAllHTML(); return; }
  if (t.id === 'skinFile') { readSkin(t); return; }
  if (t.name === 'wizIcon' && wiz) { wiz.icon = t.value; updatePreview(); }
  else if (t.id === 'wizNoBg') { wiz.noBg = t.checked; updatePreview(); wizSay(t.checked ? 'No background.' : 'Background: ' + bgName(wiz.bg)); }
  else if (t.id === 'bgColor') { wizSay('Background: ' + bgName(wiz.bg)); }
  else if (t.classList.contains('bd-import')) { const f = t.files[0]; if (f) toast(`In the real launcher, Bedrock would open ${f.name}.`); t.value = ''; }
  else if (t.classList.contains('mod-check')) { t.checked ? checked.add(t.dataset.id) : checked.delete(t.dataset.id); updateAddBar(); }
  else if (t.id === 'exploreTarget') { state.explore.targetId = t.value; checked.clear(); save(); renderModList(); }
  else if (t.name === 'exType') { state.explore.type = t.value; save(); renderModList(); }
  else if (t.id === 'contentFilter') { state.contentFilter = t.value; save(); renderAll('contentFilter'); }
  else if (t.name === 'instLook' && i) { i.look = t.value; save(); renderAll(); const r = $(`input[name="instLook"][value="${t.value}"]`); if (r) r.focus(); toast(`Look set to ${t.value === 'custom' ? 'Custom' : 'Vanilla'}.`); }
  else if (t.id === 'presetSelect' && i) { i.preset = t.value; save(); renderAll('presetSelect'); toast(`Preset set to ${PRESETS[t.value].name}.`); }
  else if (t.id === 'hoverToggle') { state.settings.hoverSpeak = t.checked; save(); toast(t.checked ? 'Hover names are on.' : 'Hover names are off.'); }
  else if (t.id === 'reduceToggle') { state.settings.reduceMotion = t.checked; save(); applyMotion(); toast(t.checked ? 'Animations reduced.' : 'Animations are back on.'); }
  else if (t.name === 'ldStyle') { state.settings.loaderStyle = t.value; save(); $('#ldStage').innerHTML = loaderArt(t.value); }
});
document.addEventListener('input', e => {

document.addEventListener('keydown', e => {
  const tab = e.target.closest && e.target.closest('[role="tab"]');
  if (!tab || !['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return;
  const tabs = $$('[role="tab"]', tab.parentElement), n = tabs.length;
  let k = tabs.indexOf(tab);
  k = e.key === 'ArrowRight' ? (k + 1) % n : e.key === 'ArrowLeft' ? (k - 1 + n) % n : e.key === 'Home' ? 0 : n - 1;
  e.preventDefault(); tabs[k].click();
});

function showTip(el) {
  if (!ctx.hidden) return;
  const host = dlg.open && dlg.contains(el) ? dlg : document.body; if (tip.parentNode !== host) host.appendChild(tip);
  const r = el.getBoundingClientRect();
  tip.innerHTML = esc(el.dataset.tip) + (el.dataset.sub ? `<small>${esc(el.dataset.sub)}</small>` : '');
  tip.classList.remove('below', 'show');
  const w = tip.offsetWidth;
  if (r.right + 14 + w < innerWidth - 8) { tip.style.left = (r.right + 14) + 'px'; tip.style.top = (r.top + r.height / 2) + 'px'; }
  else { tip.classList.add('below'); tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px'; tip.style.top = (r.bottom + 10) + 'px'; }
  void tip.offsetWidth; tip.classList.add('show');
}
function hideTip() { tip.classList.remove('show'); }
document.addEventListener('mouseover', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el); });
document.addEventListener('mouseout', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && !el.contains(e.relatedTarget)) hideTip(); });
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && e.target.matches(':focus-visible')) showTip(el); });
document.addEventListener('focusout', hideTip);
/* Mouse hover: say the name under the pointer (for screen reader users who explore with the mouse) */
let hvEl = null, hvT = null;
function hoverName(el) {
  let n = el.dataset.tip ? el.dataset.tip + (el.dataset.sub ? ', ' + el.dataset.sub : '') : (el.getAttribute('aria-label') || el.textContent.replace(/\s+/g, ' ').trim());
  if (!n) return '';
  if (el.hasAttribute('aria-pressed')) n += el.getAttribute('aria-pressed') === 'true' ? ', pressed' : ', not pressed';
  if (el.getAttribute('aria-current') === 'page') n += ', current';
  if (el.hasAttribute('disabled') || el.getAttribute('aria-disabled') === 'true') n += ', unavailable';
  return n;
}
document.addEventListener('mouseover', e => {
  if (state.settings.hoverSpeak === false) return;
  const el = e.target.closest && e.target.closest('button,a[href],[data-tip],[role="menuitem"]');
  if (!el || el === hvEl || el.id === 'wmap') return; hvEl = el; clearTimeout(hvT);
  hvT = setTimeout(() => { const n = hoverName(el), r = $('#hoverSay'); if (!n) return; r.textContent = ''; setTimeout(() => { r.textContent = n; }, 40); }, 260);
});
document.addEventListener('mouseout', e => { if (hvEl && !hvEl.contains(e.relatedTarget)) { hvEl = null; clearTimeout(hvT); } });
$('#instList').addEventListener('scroll', hideTip);

/* Right-click menu: mouse right-click, Shift+F10 or the Applications key */
document.addEventListener('contextmenu', e => {
  const b = e.target.closest && e.target.closest('.inst-btn[data-id], .world-btn'); if (!b) return;
  e.preventDefault();
  let x = e.clientX, y = e.clientY;
  if (!x && !y) { const r = b.getBoundingClientRect(); x = r.right + 8; y = r.top; }
  openCtx(b.classList.contains('world-btn') ? {type:'world', inst:b.dataset.inst, key:b.dataset.key, ret:b.id} : {type:'inst', id:b.dataset.id, ret:b.id}, x, y);
});
ctx.addEventListener('keydown', e => {
  const items = $$('.ctx-item', ctx), k = items.indexOf(document.activeElement);
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeCtx(true); return; }
  if (e.key === 'Tab') { e.preventDefault(); closeCtx(true); return; }
  const to = {ArrowDown:(k + 1) % items.length, ArrowUp:(k - 1 + items.length) % items.length, Home:0, End:items.length - 1}[e.key];
  if (to !== undefined) { e.preventDefault(); items[to].focus(); }
});
ctx.addEventListener('click', e => { const b = e.target.closest('.ctx-item'); if (b) runCtx(b.dataset.cx); });
document.addEventListener('pointerdown', e => { if (!ctx.hidden && !ctx.contains(e.target) && !(e.target.closest && e.target.closest('#moreBtn'))) closeCtx(false); }, true);

/* Click ripple (from Nextlayer.css). Lives in its own layer so re-renders don't cut it off. */
document.addEventListener('pointerdown', e => {
  if (state.settings.reduceMotion || e.button !== 0) return;
  const el = e.target.closest && e.target.closest('.btn,.tab,.inst-btn,.ctx-item,.w-tool,.x-btn,.skin-chip,.shot-btn');
  if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
  const r = el.getBoundingClientRect(), wrap = document.createElement('span'), dot = document.createElement('span');
  wrap.className = 'ripple-wrap'; dot.className = 'ripple';
  Object.assign(wrap.style, {left:r.left + 'px', top:r.top + 'px', width:r.width + 'px', height:r.height + 'px', borderRadius:getComputedStyle(el).borderRadius});
  const size = Math.max(r.width, r.height) * 2.2;
  Object.assign(dot.style, {width:size + 'px', height:size + 'px', left:(e.clientX - r.left - size / 2) + 'px', top:(e.clientY - r.top - size / 2) + 'px'});
  wrap.appendChild(dot); (dlg.open && dlg.contains(el) ? dlg : document.body).appendChild(wrap);
  setTimeout(() => wrap.remove(), 650);
});
window.addEventListener('resize', () => { hideTip(); closeCtx(false); placePills(); });

/* ================= Start ================= */
$('#logo').innerHTML = LOGO + '<span class="logo-text">Nextlauncher</span>';
$('#buyBtn').href = BUY_URL;
if (location.hash && !['#home','#explore','#settings','#content'].includes(location.hash)) state.view = 'lost';
else if (location.hash === '#explore' || location.hash === '#settings') state.view = location.hash.slice(1);
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'iconSearch') e.preventDefault(); });
dlg.addEventListener('cancel', e => { const p = $('#bgPanel', dlg); if (p && !p.hidden) { e.preventDefault(); p.hidden = true; const b = $('#bgBtn', dlg); b.setAttribute('aria-expanded', 'false'); b.focus(); } });
setInterval(() => { const el = document.getElementById('clockTime'); if (el) el.textContent = timeStr(); }, 1000);
applyMotion();
renderAll();
if (!state.signedIn) setTimeout(openAccount, 450);
})();
</script>
</body>
</html>
